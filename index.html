<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You 💌</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;color:#4a2940;
  background:radial-gradient(circle at 50% 10%,#fff0f6 0,#ffd5e5 35%,#d9b4f2 100%);
}
.bg-heart{position:absolute;bottom:-40px;opacity:.55;animation:float linear infinite;pointer-events:none}
@keyframes float{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.scene{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
.envelope{
  position:absolute;width:340px;height:225px;border-radius:10px;cursor:pointer;
  background:#fff3f7;box-shadow:0 25px 60px #693d5640;
  transition:transform .9s ease,opacity .9s ease;
}
.envelope:hover{transform:scale(1.045) rotate(-1deg)}
.pocket{
  position:absolute;inset:0;background:#f4adc5;
  clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);z-index:3;border-radius:10px;
}
.flap{
  position:absolute;inset:0;background:#ffc6d9;clip-path:polygon(0 0,100% 0,50% 58%);
  transform-origin:top;transition:transform 1s cubic-bezier(.2,.8,.2,1);z-index:5;
}
.seal{
  position:absolute;left:50%;top:88px;transform:translateX(-50%);
  width:62px;height:62px;border-radius:50%;background:#e84e7c;color:white;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 7px 18px #7b284750;z-index:10;transition:.55s;
}
.hint{
  position:absolute;bottom:-58px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font:16px Arial,sans-serif;color:#673c57;animation:pulse 1.8s infinite
}
@keyframes pulse{50%{opacity:.4}}
.open .flap{transform:rotateX(180deg)}
.open .seal{opacity:0;transform:translateX(-50%) scale(0)}
.open .envelope{transform:translateY(330px) rotate(5deg) scale(.45);opacity:0}
.letter{
  position:absolute;width:min(88vw,680px);max-height:78vh;overflow:auto;
  padding:48px;background:#fffdf8;border-radius:14px;
  box-shadow:0 30px 80px #4d304040;
  opacity:0;transform:translateY(90px) scale(.72);
  pointer-events:none;transition:opacity 1s .45s,transform 1s .45s cubic-bezier(.16,1,.3,1);
}
.letter.show{opacity:1;transform:none;pointer-events:auto}
.letter h1{text-align:center;color:#d94772;font-size:36px;margin-bottom:28px}
.letter p{font-size:21px;line-height:1.8;margin:14px 0}
.signature{text-align:right;color:#d94772;font-size:20px;margin-top:30px}
.close{display:block;margin:28px auto 0;border:0;border-radius:999px;padding:10px 20px;background:#f3b2c9;color:#54283e;cursor:pointer}
@media(max-width:600px){.envelope{width:285px;height:190px}.letter{padding:28px}.letter h1{font-size:29px}.letter p{font-size:18px}}
</style>
</head>
<body>
<div class="bg-heart" style="left:8%;animation-duration:9s;font-size:25px">♥</div>
<div class="bg-heart" style="left:22%;animation-duration:12s;font-size:20px">♡</div>
<div class="bg-heart" style="left:43%;animation-duration:10s;font-size:28px">♥</div>
<div class="bg-heart" style="left:67%;animation-duration:13s;font-size:22px">♡</div>
<div class="bg-heart" style="left:86%;animation-duration:8s;font-size:27px">♥</div>

<div class="scene" id="scene">
  <div class="envelope" id="envelope" aria-label="Open the letter">
    <div class="pocket"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
    <div class="hint">Click the letter 💌</div>
  </div>

  <article class="letter" id="letter">
    <h1>For You ❤️</h1>
    <p><strong>AAPKE SAARE PAISE hamare HUE 🐷</strong></p>
    <p>CHECK YOUR BANK ACCOUNT </p>
    <div class="signature">— Tech interio</div>
    <button class="close" id="close">Close letter</button>
  </article>
</div>

<script>
const scene=document.getElementById('scene');
const envelope=document.getElementById('envelope');
const letter=document.getElementById('letter');
const close=document.getElementById('close');

envelope.addEventListener('click',()=>{
  scene.classList.add('open');
  setTimeout(()=>letter.classList.add('show'),700);
});
close.addEventListener('click',()=>{
  letter.classList.remove('show');
  setTimeout(()=>scene.classList.remove('open'),500);
});
</script>
</body>
</html>
